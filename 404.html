<!doctype html>
<html lang="en" dir="ltr" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var l = 'en';
      try { if (localStorage.getItem('lang') === 'ar') { l = 'ar'; } } catch (e) {}
      var h = document.documentElement;
      h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr'; h.setAttribute('data-lang', l);
    })();
  </script>
  <title>Page not found | Sami Sabarna</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:HEXP,wght@0..100,160..700&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .nf { min-height: calc(100vh - 64px - 78px); display: grid; align-items: center; padding-block: 64px; }
    .nf-flow { width: 220px; height: 60px; margin-bottom: 36px; }
    .nf h1 { font-size: clamp(2.25rem, 1.5rem + 3vw, 3.5rem); }
    .nf p { color: var(--muted); font-size: 1.125rem; margin: 0 0 32px; max-width: 46ch; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Sami Sabarna">
        <span class="logo keep" lang="en" aria-hidden="true">Sam<span class="logo-i">ı</span> Sabarna</span>
      </a>
      <button class="lang-toggle" type="button" data-lang-toggle style="margin-inline-start: auto">
        <span class="lang-name keep" lang="ar" data-for="en">العربية</span>
        <span class="lang-name keep" lang="en" data-for="ar">English</span>
      </button>
    </div>
  </header>

  <main class="wrap nf">
    <div>
      <!-- A flow that ends in a BPMN error event -->
      <svg class="nf-flow" viewBox="0 0 220 60" dir="ltr" aria-hidden="true" focusable="false">
        <circle cx="22" cy="30" r="14" fill="#0d2140" stroke="#22d3ee" stroke-width="1.8"/>
        <path d="M38 30H170" stroke="#3b5b86" stroke-width="1.8" stroke-dasharray="5 6"/>
        <circle cx="192" cy="30" r="15" fill="#0d2140" stroke="#a78bfa" stroke-width="3.5"/>
        <path d="M185 38l4-11 5 5 4-10" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <h1><span lang="en">This page doesn't exist.</span><span lang="ar">هذه الصفحة غير موجودة.</span></h1>
      <p lang="en">The link may be old or mistyped.</p>
      <p lang="ar">ربما الرابط قديم أو فيه خطأ.</p>
      <a class="btn btn-primary" href="/"><span lang="en">Go to the homepage</span><span lang="ar">العودة إلى الصفحة الرئيسية</span></a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; 2026 <span lang="en">Sami Sabarna</span><span lang="ar">سامي صبارنة</span></p>
      <p><span lang="en">Amman, Jordan</span><span lang="ar">عمّان، الأردن</span></p>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var titles = { en: 'Page not found | Sami Sabarna', ar: 'الصفحة غير موجودة | سامي صبارنة' };
      function apply(l) {
        root.lang = l; root.dir = l === 'ar' ? 'rtl' : 'ltr'; root.setAttribute('data-lang', l);
        document.title = titles[l];
      }
      apply(root.getAttribute('data-lang') === 'ar' ? 'ar' : 'en');
      var btn = document.querySelector('[data-lang-toggle]');
      btn.addEventListener('click', function () {
        var l = root.getAttribute('data-lang') === 'ar' ? 'en' : 'ar';
        apply(l);
        try { localStorage.setItem('lang', l); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
