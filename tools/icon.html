<!doctype html>
<!-- Source for assets/favicon-*.png and assets/apple-touch-icon.png. Rendered at 512x512, then scaled down. -->
<!-- ?v=tile gives rounded corners (favicon); ?v=full fills the square (Apple touch icon, iOS rounds it itself). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:HEXP,wght@0..100,160..700&display=block">
  <style>
    html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: transparent; }
    .icon {
      width: 512px; height: 512px; display: grid; place-items: center;
      background: #0c1d35;
      font-family: "Readex Pro", sans-serif;
    }
    .tile { border-radius: 112px; }
    .s {
      position: relative;
      margin: -24px 0 0 -30px;
      font-size: 372px; font-weight: 650; line-height: 1; color: #eef4fc;
      font-variation-settings: "HEXP" 12;
    }
    .s i {
      position: absolute; right: -78px; top: 34px;
      width: 88px; height: 88px; border-radius: 50%;
      background: #22d3ee; box-shadow: 0 0 46px rgba(34, 211, 238, .75);
    }
  </style>
</head>
<body>
  <div class="icon" id="icon"><span class="s">S<i></i></span></div>
  <script>
    if (new URLSearchParams(location.search).get('v') !== 'full') document.getElementById('icon').classList.add('tile');
  </script>
</body>
</html>
